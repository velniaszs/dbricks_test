# Pre-commit configuration for Python project template
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# Frozen trees, mirroring extend-exclude in pyproject.toml. The generic hooks
# below have no language filter, so without this they rewrite the v1 baseline.
exclude: '^(databricks_v1|databricks_V2)/'

repos:
  # Ruff linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.8.4
    hooks:
      # Run the linter
      - id: ruff
        args: [--fix]
        types_or: [python, pyi, jupyter]
      # Run the formatter
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  # Additional useful hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: mixed-line-ending
        args: ['--fix=lf']
